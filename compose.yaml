services:
  media-servarr-sync:
    image: ghcr.io/johnfawkes/media-servarr-sync:latest
    container_name: media-servarr-sync
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "${PORT:-5000}:${PORT:-5000}"

    # All app config (PLEX_URL, PLEX_TOKEN, MANUAL_USER, SONARR_URL, etc.) is
    # loaded straight from .env via env_file above — there's no need to also
    # list them under `environment:`. Anything left unset in .env can be
    # configured later from the Settings page in the web UI instead; only
    # values present here or in .env are locked/read-only there.

    # Mount the host media root into the container at the path Plex sees.
    # MEDIA_ROOT  = host path  (e.g. /mnt/nvme/MergerFS)
    # CONTAINER_MEDIA = path inside this container = the path Plex uses (e.g. /data/media)
    # Remove this volume if you don't use MINIMUM_AGE.
    volumes:
      - "${MEDIA_ROOT:-/mnt/media}:${CONTAINER_MEDIA:-/mnt/media}"
      # Persistent storage for sync history database
      - media-servarr-sync-data:/data

    healthcheck:
      test: /bin/sh -c 'curl -sf http://localhost:$${PORT:-5000}/health || exit 1'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media-servarr-sync-data:
