<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Servarr Sync · Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><rect width='24' height='24' rx='4' fill='%230d0d0f'/><path stroke='%23e5a00d' stroke-width='2' stroke-linecap='round' d='M20 12a8 8 0 1 1-1.6-4.8'/><polyline stroke='%23e5a00d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' points='20,4 20,8 16,8'/></svg>">

<meta name="theme-color" content="#e5a00d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ServarrSync">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/fonts.css">
<style>

  :root {
    --bg: #0d0d0f;
    --surface: #161618;
    --border: #2a2a2e;
    --accent: #e5a00d;
    --text: #e8e8e8;
    --muted: #666;
    --error: #f87171;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 32px;
    width: 100%;
    max-width: 360px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .logo-icon {
    flex-shrink: 0;
    filter: drop-shadow(0 0 6px rgba(229,160,13,0.5));
  }

  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-transform: uppercase;
  }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input {
    display: block;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--accent); }

  input[type="checkbox"] {
    display: inline-block;
    width: auto;
    margin: 0 6px 0 0;
    accent-color: var(--accent);
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    text-transform: none;
    letter-spacing: normal;
    margin-bottom: 20px;
    cursor: pointer;
  }

  button {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #0d0d0f;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 11px;
    cursor: pointer;
    text-transform: uppercase;
    margin-top: 4px;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.85; }

  .error {
    font-size: 11px;
    color: var(--error);
    background: rgba(248,113,113,0.07);
    border: 1px solid var(--error);
    border-radius: var(--radius);
    padding: 8px 12px;
    margin-bottom: 16px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .plex-btn {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 11px;
    cursor: pointer;
    text-transform: uppercase;
    transition: border-color 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .plex-btn:hover { border-color: var(--accent); color: var(--accent); }
  .plex-btn:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" width="28" height="28">
      <rect width="24" height="24" rx="4" fill="#0d0d0f"/>
      <path stroke="#e5a00d" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-1.6-4.8"/>
      <polyline stroke="#e5a00d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="20,4 20,8 16,8"/>
    </svg>
    <h1>Media Servarr Sync</h1>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post"> {# nosemgrep: django-no-csrf-token #}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
    <label class="checkbox-label">
      <input type="checkbox" id="remember_me" name="remember_me">
      Remember me
    </label>
    <button type="submit">Sign in</button>
  </form>
  <div class="divider">or</div>
  <button type="button" class="plex-btn" id="plex-login-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="4" fill="#e5a00d"/><path stroke="#0d0d0f" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-1.6-4.8"/></svg>
    Sign in with Plex
  </button>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }

  (function() {
    var btn = document.getElementById('plex-login-btn');
    if (!btn) return;
    var pollTimer = null;

    function stopPoll() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      btn.disabled = false;
      btn.textContent = '';
      btn.appendChild(document.createTextNode('Sign in with Plex'));
    }

    btn.addEventListener('click', function() {
      btn.disabled = true;
      btn.textContent = 'Waiting for Plex…';
      fetch('/auth/plex/start', {method: 'POST'})
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.id || !data.auth_url) { stopPoll(); return; }
          var popup = window.open(data.auth_url, 'plex-auth', 'width=500,height=700');
          pollTimer = setInterval(function() {
            fetch('/auth/plex/poll?id=' + encodeURIComponent(data.id))
              .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
              .then(function(res) {
                if (res.data.authenticated) {
                  clearInterval(pollTimer);
                  if (popup) popup.close();
                  window.location.href = '/';
                } else if (!res.ok) {
                  clearInterval(pollTimer);
                  if (popup) popup.close();
                  stopPoll();
                  alert(res.data.error || 'Plex sign-in failed');
                }
              })
              .catch(function() {});
          }, 2000);
        })
        .catch(function() { stopPoll(); });
    });
  })();
</script>
</body>
</html>
