name: PR Docker Build

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event.label.name == 'docker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Log into GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sanitise branch name for Docker tag
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Replace non-alphanumeric chars with hyphens and lowercase
          TAG=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push PR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.branch.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post pull instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.branch.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            const image = `ghcr.io/${process.env.IMAGE_NAME}:${tag}`;
            const body = `### 🐳 PR Docker image ready\n\`\`\`\ndocker pull ${image}\ndocker run -d -p 5000:5000 \\\n  -e SECRET_KEY=changeme \\\n  -e PLEX_URL=http://your-plex:32400 \\\n  -e PLEX_TOKEN=your-token \\\n  -e SECTION_MAPPING='{"/": "1"}' \\\n  ${image}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
